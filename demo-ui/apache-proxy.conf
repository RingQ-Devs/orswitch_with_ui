# OpenRings demo: let the browser reach the switch's WebSocket from this web server's origin.
#
# Why: the switch only accepts a WebSocket whose Origin host equals the Host it
# was called with. The demo page is served by XAMPP (http://localhost/...), so
# XAMPP forwards /orws to the switch and keeps the Host header.
#
# Use (XAMPP): add this line at the end of C:\xampp\apache\conf\httpd.conf, then restart Apache:
#   Include "C:/xampp/htdocs/ringq_with_git/openrings/demo-ui/apache-proxy.conf"
# Edit the address below if your switch is not on this machine.

LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so

# The switch has a self-signed certificate by default: do not verify it (demo only!).
SSLProxyEngine on
SSLProxyVerify none
SSLProxyCheckPeerCN off
SSLProxyCheckPeerName off
SSLProxyCheckPeerExpire off

ProxyPreserveHost On
ProxyPass /orws wss://127.0.0.1:8443/api/ws
# If the switch's <web> tls is "off", use instead:
# ProxyPass /orws ws://127.0.0.1:8443/api/ws
